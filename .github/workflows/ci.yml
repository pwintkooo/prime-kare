name: Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  frontend_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  backend_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: backend/dev/PrimeKare.Api
        run: dotnet restore

      - name: Build
        working-directory: backend/dev/PrimeKare.Api
        run: dotnet build --no-restore
  
  backend_test:
    needs: 
      - frontend_build
      - backend_build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run backend tests
        working-directory: backend/PrimeKare.Api.Tests
        run: dotnet test